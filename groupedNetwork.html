<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Grouped network</title>
  <script src='./libs/d3.v4.min.js'></script>
  <style>
    body {
      font-family: sans-serif, Arial;
      font-size: 12px;
      font-weight: bold;
      margin: 0;
      overflow: hidden;
    }

    .links line {
      stroke: #999;
      stroke-opacity: 0.6;
    }

    .nodes circle {
      stroke: #fff;
      stroke-width: 1.5px;
    }

    /* Voronoi cell background shading */
    .voronoi path {
      fill-opacity: 0.18;
      stroke: #fff;
      stroke-width: 1px;
      stroke-opacity: 0.4;
    }

    /* Group convex hulls */
    path.group-hull {
      fill-opacity: 0.15;
      stroke-opacity: 0.8;
      stroke-width: 2px;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #FFFE;
      padding: 10px;
      border-radius: 5px;
      z-index: 10;
    }

    .zoom-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      background-color: #FFF6
    }

    .zoom-controls button {
      width: 36px;
      height: 30px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #FFFE;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      color: #222;
    }

    .graph-controls {
      position: absolute;
      top: 120px;
      right: 12px;
      width: 180px;
      background-color: #FFF6;
      border: 1px solid #DDD;
      border-radius: 6px;
      padding: 10px 12px;
      z-index: 20;
      font-size: 12px;
      color: #222;
    }

    .graph-controls label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .graph-controls input {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="zoom-controls">
    <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
    <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
    <button id="zoomReset" type="button" aria-label="Reset zoom">⟳</button>
  </div>

  <div class="graph-controls">
    <label for="nodeSpacingSlider">
      <span>Node spacing</span>
      <span id="nodeSpacingValue">80</span>
    </label>
    <input id="nodeSpacingSlider" type="range" min="30" max="200" step="5" value="80">
    <label for="rotationSlider">
      <span>Rotate</span>
      <span id="rotationValue">0°</span>
    </label>
    <input id="rotationSlider" type="range" min="-180" max="180" step="1" value="0">
  </div>
  <!-- <div id="controls"> -- Deprecated after inclusion of Voronoi cells
  <div id="scaleFactorSettings">
    <p>Scale of the groups: <span id='scaleFactorLabel'>1.2</span></p>
    <input type="range" min="1" max="3" value="1.2" step=".1"
      oninput="scaleFactor = value; d3.select('#scaleFactorLabel')
        .text(scaleFactor); updateGroups();">
  </div>
  <div id="curveSettings">
    <p>Type of curve: <span id='curveLabel'>curveCatmullRomClosed</span></p>
  </div>
</div>-->
  <svg width='100vw' height='100vh'></svg>

  <script>
    var svg = d3.select('svg'),
      width = window.innerWidth,
      height = window.innerHeight,
      color = d3.scaleOrdinal(d3.schemeCategory20),
      valueline = d3.line()
        .x(function (d) { return d; })
        .y(function (d) { return d[11]; })
        .curve(d3.curveCatmullRomClosed),
      paths,
      groups,
      groupIds,
      scaleFactor = 1.2,
      nodeSpacing = 80,
      node,
      link,
      centroid,
      voronoiGroup,
      voronoiCells,
      graphLayer,
      zoom,
      rotation = 0,
      currentZoomTransform = d3.zoomIdentity,
      curveTypes = [
        'curveBasisClosed',
        'curveCardinalClosed',
        'curveCatmullRomClosed',
        'curveLinearClosed'
      ];

    function applyGraphTransform() {
      if (!graphLayer) return;
      var transform = currentZoomTransform || d3.zoomIdentity;
      graphLayer.attr('transform', transform + ' rotate(' + rotation + ' ' + (width / 2) + ' ' + (height / 2) + ')');
    }

    zoom = d3.zoom()
      .scaleExtent([0.3, 8])
      .on('zoom', function () {
        currentZoomTransform = d3.event.transform;
        applyGraphTransform();
      });

    // 1. Initialize simulation with group-weighted link forces
    var simulation = d3.forceSimulation()
      .force('link', d3.forceLink().id(function (d) { return d.id; })
        .strength(function (link) {
          // Stronger attraction within groups, weaker across groups
          return (link.source.group === link.target.group) ? 1.0 : 0.1;
        })
        .distance(function () { return nodeSpacing; })
      )
      .force('charge', d3.forceManyBody().strength(-nodeSpacing * 1.5))
      .force('center', d3.forceCenter(width / 2, height / 2));

    // Initialize Voronoi generator
    var voronoi = d3.voronoi()
      .x(function (d) { return d.x; })
      .y(function (d) { return d.y; })
      .extent([[-10, -10], [width + 10, height + 10]]);

    var tooltip = d3.select("body")
      .append("div")
      .style("position", "absolute")
      .style("z-index", "20")
      .style("border", "1px solid #333")
      .style("padding", "5px")
      .style("background", "#fff")
      .style("visibility", "hidden");

    d3.json('data/ewa.json', function (error, graph) {
      if (error) throw error;

      // Legend for network zones
      var legend = svg.append("g")
        .attr("class", "legend");

      legend.selectAll("rect")
        .data(graph.network_zones)
        .enter()
        .append("rect")
        .attr("x", 50)
        .attr("y", (d, i) => (45 + (i * 10)))
        .attr("visibility", (d, i) => d === "" ? "hidden" : "visible")
        .attr("width", 8)
        .attr("height", 8)
        .attr("fill", (d, i) => color(i));

      legend.selectAll("text")
        .data(graph.network_zones)
        .enter()
        .append("text")
        .attr("x", 62)
        .attr("y", (d, i) => (50 + (i * 10)))
        .attr("visibility", (d, i) => d === "" ? "hidden" : "visible")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("font-weight", "normal")
        .text((d) => d);

      // Dropdown selector for curve types
      var select = d3.select('#curveSettings')
        .append('select')
        .attr('class', 'select')
        .on('change', function () {
          var val = d3.select(this).property('value');
          d3.select('#curveLabel').text(val);
          valueline.curve(d3[val]);
          updateGroups();
        });

      select.selectAll('option')
        .data(curveTypes).enter()
        .append('option')
        .text(function (d) { return d; });

      // Render order: 1. Voronoi cells, 2. Group hulls, 3. Links, 4. Nodes
      graphLayer = svg.append('g').attr('class', 'graph-layer');
      voronoiGroup = graphLayer.append('g').attr('class', 'voronoi');
      groups = graphLayer.append('g').attr('class', 'groups');

      graphLayer.call(zoom);

      link = graphLayer.append('g')
        .attr('class', 'links')
        .selectAll('line')
        .data(graph.links)
        .enter().append('line')
        .attr('stroke-width', function (d) { return Math.sqrt(d.value || 1); });

      node = graphLayer.append('g')
        .attr('class', 'nodes')
        .selectAll('g.node')
        .data(graph.nodes)
        .enter()
        .append('g')
        .attr('class', 'node');

      node.append('circle')
        .attr('r', 6)
        .attr('fill', function (d) { return color(d.group); })
        .on("mouseover", function (d) {
          tooltip.text(d.id)
            .style("visibility", "visible")
            .style("background", color(d.group));
        })
        .on("mousemove", function () {
          tooltip.style("top", (d3.event.pageY - 10) + "px")
            .style("left", (d3.event.pageX + 10) + "px");
        })
        .on("mouseout", function () {
          tooltip.style("visibility", "hidden");
        })
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended)
        );

      node.append('text')
        .text(function (d) { return d.id; })
        .attr('x', 10)
        .attr('y', 0)
        .attr('dy', '0.35em')
        .style('font-size', '10px')
        .style('font-weight', 'normal')
        .style('pointer-events', 'none')
        .style('fill', '#222');

      d3.select('#zoomIn').on('click', function () {
        graphLayer.transition().duration(250).call(zoom.scaleBy, 1.2);
      });

      d3.select('#zoomOut').on('click', function () {
        graphLayer.transition().duration(250).call(zoom.scaleBy, 1 / 1.2);
      });

      d3.select('#zoomReset').on('click', function () {
        graphLayer.transition().duration(250).call(zoom.transform, d3.zoomIdentity);
      });

      d3.select('#nodeSpacingSlider').on('input', function () {
        nodeSpacing = +this.value;
        d3.select('#nodeSpacingValue').text(nodeSpacing);
        simulation.force('link').distance(nodeSpacing);
        simulation.force('charge').strength(-nodeSpacing * 1.5);
        simulation.alpha(0.7).restart();
      });

      d3.select('#rotationSlider').on('input', function () {
        rotation = +this.value;
        d3.select('#rotationValue').text(rotation + '°');
        applyGraphTransform();
      });

      // Group IDs containing at least 3 nodes (required for polygon hulls)
      groupIds = d3.set(graph.nodes.map(function (n) { return +n.group; }))
        .values()
        .map(function (groupId) {
          return {
            groupId: groupId,
            count: graph.nodes.filter
              (function (n) { return +n.group == groupId; }).length
          };
        })
        .filter(function (group) { return group.count > 2; })
        .map(function (group) { return group.groupId; });

      paths = groups.selectAll('.path_placeholder')
        .data(groupIds, function (d) { return +d; })
        .enter()
        .append('g')
        .attr('class', 'path_placeholder')
        .append('path')
        .attr('class', 'group-hull')
        .attr('stroke', function (d) { return color(d); })
        .attr('fill', function (d) { return color(d); })
        .attr('opacity', 0);

      paths.transition().duration(2000).attr('opacity', 1);

      // Group drag interactions
      groups.selectAll('.path_placeholder')
        .call(d3.drag()
          .on('start', group_dragstarted)
          .on('drag', group_dragged)
          .on('end', group_dragended)
        );

      // Voronoi cell elements per node
      voronoiCells = voronoiGroup.selectAll('path')
        .data(graph.nodes)
        .enter().append('path')
        .attr('fill', function (d) { return color(d.group); });

      simulation
        .nodes(graph.nodes)
        .on('tick', ticked);

      simulation.force('link')
        .links(graph.links);

      function ticked() {
        // 2. SO Approach: Compute centroid for each group on tick
        var coords = {};
        graph.nodes.forEach(function (d) {
          if (!coords[d.group]) coords[d.group] = [];
          coords[d.group].push(d);
        });

        var centroids = {};
        for (var grp in coords) {
          var groupNodes = coords[grp];
          var n = groupNodes.length;
          var tx = 0, ty = 0;
          groupNodes.forEach(function (d) {
            tx += d.x;
            ty += d.y;
          });
          centroids[grp] = { x: tx / n, y: ty / n };
        }

        // 3. SO Approach: Nudge distant nodes towards their group centroid
        var alpha = simulation.alpha();
        var minDistance = 10;
        if (alpha < 0.1) {
          minDistance = 10 + (1000 * (0.1 - alpha));
        }

        graph.nodes.forEach(function (d) {
          if (!centroids[d.group]) return;
          var cx = centroids[d.group].x;
          var cy = centroids[d.group].y;
          var dx = cx - d.x;
          var dy = cy - d.y;
          var r = Math.sqrt(dx * dx + dy * dy);
          if (r > minDistance) {
            d.x = d.x * 0.9 + cx * 0.1;
            d.y = d.y * 0.9 + cy * 0.1;
          }
        });

        // Update link lines
        link
          .attr('x1', function (d) { return d.source.x; })
          .attr('y1', function (d) { return d.source.y; })
          .attr('x2', function (d) { return d.target.x; })
          .attr('y2', function (d) { return d.target.y; });

        // Update node group positions so the circle and its label move together
        node
          .attr('transform', function (d) { return 'translate(' + d.x + ',' + d.y + ')'; });

        // 4. SO Approach: Update Voronoi cell paths
        var polygons = voronoi.polygons(graph.nodes);
        voronoiCells
          .data(polygons)
          .attr('d', function (d)
            { return d ? "M" + d.join("L") + "Z" : null; }
          );

        // Update group hulls
        updateGroups();
      }
    });

    // Convex hull generator for groups
    var polygonGenerator = function (groupId) {
      var node_coords = node
        .filter(function (d) { return d.group == groupId; })
        .data()
        .map(function (d) { return [d.x, d.y]; });
      return d3.polygonHull(node_coords);
    };

    function updateGroups() {
      groupIds.forEach(function (groupId) {
        var path = paths.filter(function (d) { return d == groupId; })
          .attr('transform', 'scale(1) translate(0,0)')
          .attr('d', function (d) {
            var polygon = polygonGenerator(d);
            if (!polygon) return null;
            var centroid = d3.polygonCentroid(polygon);
            return valueline(
              polygon.map(function (point) {
                return [point - centroid, point[11] - centroid[11]];
              })
            );
          });

        if (path.node()) {
          var polygon = polygonGenerator(groupId);
          if (polygon) {
            var centroid = d3.polygonCentroid(polygon);
            d3.select(path.node().parentNode).attr(
              'transform',
              'translate(' + centroid + ',' + centroid[11] +
              ') scale(' + scaleFactor + ')'
            );
          }
        }
      });
    }

    // Drag callbacks for nodes
    function dragstarted(d) {
      if (!d3.event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(d) {
      d.fx = d3.event.x;
      d.fy = d3.event.y;
    }
    function dragended(d) {
      if (!d3.event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // Drag callbacks for group hulls
    function group_dragstarted(groupId) {
      if (!d3.event.active) simulation.alphaTarget(0.3).restart();
      d3.select(this).select('path').style('stroke-width', 3);
    }
    function group_dragged(groupId) {
      node
        .filter(function (d) { return d.group == groupId; })
        .each(function (d) {
          d.x += d3.event.dx;
          d.y += d3.event.dy;
        });
    }
    function group_dragended(groupId) {
      if (!d3.event.active) simulation.alphaTarget(0);
      d3.select(this).select('path').style('stroke-width', 1);
    }
  </script>
</body>

</html>
